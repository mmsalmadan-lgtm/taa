:root[data-theme="dark"]{--bg:#121418;--surface:#1B1F26;--sunk:#252A33;--ink:#E8EBF0;--muted:#9AA3B2;--line:#2C323C;--accent:#E5574C;--accent-soft:#3A1E1C;--navy:#0D1015;--navy-2:#1A1F28;--navy-ink:#F1F3F6;--navy-sub:#9AA3B2;--bad:#F07468;--bad-soft:#3A1E1C;--warn:#E3B45C;--warn-soft:#352A14;--good:#6CC497;--good-soft:#173024;--ring-track:#2C323C}
.band{background:var(--navy);color:var(--navy-ink);border-radius:20px;padding:18px 18px 0;gap:10px;border-bottom:5px solid var(--accent)}

.band .stepper{background:transparent;border:0;border-radius:0}
.band .steps{padding:0;gap:0}
.band .step{background:transparent!important;color:var(--navy-sub);border-radius:0;padding:12px 14px 14px;font-size:15px;border-bottom:4px solid transparent;margin-bottom:-5px;flex:none}
.band .step .n{display:none}
.band .step.done::after{content:"✓";color:var(--good);font-size:12px;margin-inline-start:4px}
.band .step[aria-current="step"]{color:var(--navy-ink);font-weight:600;border-bottom-color:var(--accent)}
.band .status{background:var(--navy-2);color:var(--navy-sub)}
.waiting{background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.wchip:hover{background:var(--navy-2)}
.wchip .cnt{background:var(--accent);color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 7px}
.waiting .ok{color:var(--navy-sub);font-size:14px}
.phead.colored{background:transparent;border:0;padding:0}

:root{
 --display:"SAR","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;--body:"SAR","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
 --bg:#F3F3F3;--surface:#FFFFFF;--sunk:#F3F3F3;--ink:#181818;--muted:#5C5C5C;--line:#E5E5E5;--field:#C9C9C9;
 --ui:#0B5CAB;--ui-2:#1B96FF;--ui-1:#EEF4FF;
 --eng9:#0A3D7A;--eng6:#2A72D4;--eng1:#E4EEFB;
 --k-str:#0B5CAB;--k-str1:#E8F0FB;--k-fin:#7B4CC2;--k-fin1:#F2ECFB;
 --acc9:#0E5A3A;--acc6:#1F8A5B;--acc1:#E2F3EA;--out:#3F4B54;--neg:#9F1D1D;
 --crit:#C23934;--crit1:#FCE4E2;--warn:#A86400;--warn1:#FFF0D2;
 --accent:var(--ui);--accent-ink:#fff;--accent-soft:var(--ui-1);--navy:var(--ui);--navy-ink:#fff;--navy-2:#E5E5E5;--navy-sub:#5C5C5C;
 --bad:var(--crit);--bad-soft:var(--crit1);--warn-soft:var(--warn1);--good:var(--acc6);--good-soft:var(--acc1);--ring-track:#ECECEC;
 --c-dash:var(--ui);--c-cash:var(--acc6);--c-proj:var(--eng6);--c-exp:var(--acc6);--c-subs:var(--eng6);--c-sups:var(--acc6);--c-other:var(--acc6);--c-rec:var(--acc6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#16181B;--surface:#1F2227;--sunk:#262A30;--ink:#ECEEF1;--muted:#A3A9B2;--line:#33383F;--field:#4A5059;
 --ui:#5AA9FF;--ui-2:#5AA9FF;--ui-1:#1C2C42;--eng9:#9CC4FF;--eng6:#5A9CF0;--eng1:#1C2C42;
 --k-str:#5AA9FF;--k-str1:#1C2C42;--k-fin:#B794F4;--k-fin1:#2A2238;
 --acc9:#7DD3A6;--acc6:#4CB884;--acc1:#173126;--out:#B7C0C8;--neg:#F29B9B;--crit:#F07A73;--crit1:#3A1F1E;--warn:#E9B45A;--warn1:#372A12;
 --ring-track:#33383F;--navy-2:#33383F;--navy-sub:#A3A9B2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181B;--surface:#1F2227;--sunk:#262A30;--ink:#ECEEF1;--muted:#A3A9B2;--line:#33383F;--field:#4A5059;
 --ui:#5AA9FF;--ui-2:#5AA9FF;--ui-1:#1C2C42;--eng9:#9CC4FF;--eng6:#5A9CF0;--eng1:#1C2C42;
 --k-str:#5AA9FF;--k-str1:#1C2C42;--k-fin:#B794F4;--k-fin1:#2A2238;
 --acc9:#7DD3A6;--acc6:#4CB884;--acc1:#173126;--out:#B7C0C8;--neg:#F29B9B;--crit:#F07A73;--crit1:#3A1F1E;--warn:#E9B45A;--warn1:#372A12;--ring-track:#33383F;--navy-2:#33383F;--navy-sub:#A3A9B2;color-scheme:dark}
body{font-size:14px;margin:0;background:var(--bg)}
h1,h2,h3{font-weight:600}
/* global header + tabs */
.gh{background:var(--surface);border-bottom:1px solid var(--line)}
.gh-in,.tabs-in{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gh-in{display:flex;align-items:center;gap:12px;min-height:52px}
.logo{width:30px;height:30px;border-radius:6px;background:var(--ui);color:#fff;font-weight:700;display:grid;place-items:center;font-size:16px;flex:none}
.gh-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}.gh-t b{font-size:16px;font-weight:600}.gh-t span{font-size:12px;color:var(--muted)}
.gh .status{margin-inline-start:auto}
.tabs{background:var(--surface);border-bottom:3px solid var(--ui);box-shadow:0 2px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.tabs .steps{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0;min-width:0}.tabs .steps::-webkit-scrollbar{display:none}
.tabs .step{flex:none;border-radius:0;padding:11px 14px 10px;font-size:14px;color:var(--ink);background:transparent;border-bottom:3px solid transparent;margin-bottom:-3px;gap:7px}
.tabs .step:hover{background:var(--sunk)}
.tabs .step .n{width:8px;height:8px;border-radius:2px;font-size:0;background:var(--fam,var(--ui))}
.tabs .step[aria-current="step"]{background:var(--ui-1);color:var(--ink);font-weight:600;border-bottom-color:var(--ui-2)}
.tabs .step[aria-current="step"] .n{background:var(--fam,var(--ui))}
.tabs .step.done::after,.band .step.done::after{content:none}
.status{background:var(--sunk);color:var(--muted);border-radius:4px}.status.ok{background:var(--acc1);color:var(--acc9)}.status.err{background:var(--crit1);color:var(--crit)}
.wrap{padding-block:14px 56px;gap:12px}
/* page heads + sections */
.phead.colored{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.phead h2,.section-t h2,.section-t h3{border:0;padding:0}
.phead.colored .badge{display:grid;width:32px;height:32px;border-radius:6px;font-size:14px;background:var(--fam,var(--ui))}
.khead{background:var(--surface);border:1px solid var(--line);border-radius:8px;border-inline-start:1px solid var(--line);padding:10px 14px}
.khead h2{color:var(--ink)!important;font-size:16px}
.kic{border-radius:6px;width:32px;height:32px;background:var(--eng6)}
/* cards */
.card{border-radius:8px;border:1px solid var(--line);box-shadow:none;padding:14px}
.card.bad,.card.warn,.card.good,.card.grey{border-top:1px solid var(--line)}
.card.bad{box-shadow:inset -3px 0 0 var(--crit)}.card.warn{box-shadow:inset -3px 0 0 var(--warn)}
.card.add{border:1px dashed var(--field);border-radius:8px;color:var(--ui);font-size:24px}
.av{border-radius:6px;width:36px;height:36px;font-size:13px}
.tg{border-radius:4px;background:var(--sunk)}
.pill{border-radius:12px}
.sline{font-size:13px}
.tg-good{background:var(--acc1);color:var(--acc9)}.tg-bad{background:var(--crit1);color:var(--crit)}.tg-warn{background:var(--warn1);color:var(--warn)}
/* inputs + buttons */
input,select,textarea{background:var(--surface);border-color:var(--field);border-radius:4px}
.btn{border-radius:4px;border-color:var(--field);color:var(--ui);font-weight:600;padding:7px 14px}
.btn.p{background:var(--ui);border-color:var(--ui);color:#fff}
.chip{border-radius:4px}.chip[aria-pressed="true"]{background:var(--ui);border-color:var(--ui)}
.seg{border-radius:6px}.seg button{border-radius:4px}
/* KPI strip */
.kpis{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi,.kpi.c,.kpi.bad,.kpi.good,.kpi.warn{background:var(--surface);border:0;border-radius:0;position:relative;padding:12px 16px}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--fam,transparent)}
.kpi .v,.kpi.c .v,.kpi.good .v,.kpi.warn .v{color:var(--vc,var(--ink));font-size:20px}
.kpi.bad .v{color:var(--ink)}
.kpi.bad{--fam:var(--crit)}.kpi.warn{--fam:var(--warn)}
.kpi[data-f="in"]{--fam:var(--acc6);--vc:var(--acc9)}.kpi[data-f="out"]{--fam:var(--out);--vc:var(--out)}.kpi[data-f="cash"]{--fam:var(--acc6);--vc:var(--ink)}
.flag{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px}
.flag.crit{background:var(--crit1);color:var(--crit)}.flag.warn{background:var(--warn1);color:var(--warn)}
.neg{color:var(--neg)}
/* waiting */
.waiting{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.waiting b{font-size:14px}
.wchip{border:1px solid var(--field);color:var(--ink);border-radius:4px;padding:4px 6px 4px 12px;font-size:13px}
.wchip:hover{background:var(--sunk)}
.wchip .cnt{background:var(--crit);min-width:22px;height:22px;font-size:12px;border-radius:11px}
.waiting .ok{color:var(--muted)}
/* findings */
.finds{gap:0}
.find{background:transparent!important;border-radius:0;border-bottom:1px solid var(--line);padding:10px 4px}
.find:last-child{border-bottom:0}
.find .d{width:4px;height:auto;align-self:stretch;border-radius:2px;margin:0}
.find.bad .d{background:var(--crit)}.find.warn .d{background:var(--warn)}
.find .a{font-weight:600}
.hc{border-radius:6px}.hc.good b{color:var(--ink)}
.kchip{border-radius:6px;background:var(--surface);border-color:var(--line)}.kchip b{color:var(--ink)}
.citem{border-radius:6px;background:var(--surface)}
.tl{border-radius:6px}
.bar{background:var(--ring-track)}
.find .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gh-t b{white-space:nowrap}.gh .status{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stitle .sn{display:none}
.tc2 .pc-top .av,.tcard .pc-top .av{width:36px;height:36px;border-radius:8px}.tcard .pc-top .av .ico{width:20px;height:20px}
.tamt .amt,.tamt .amt-in{color:var(--fc,var(--ink));font-size:22px;font-weight:600}
.f-out{--fc:var(--out)}.f-in{--fc:var(--acc9)}.f-cash{--fc:var(--ink)}
.kpi[data-f="eng"]{--fam:var(--eng6);--vc:var(--eng9)}
.card.mat{border-top:1px solid var(--line)}
.ctr-m .tin{flex:1 1 230px}
@media (max-width:560px){.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}}
/* number colours: receivables green, payables charcoal, profit green / loss dark-red in brackets, cash + counts ink, progress blue; alerts never colour a number */
.rcv{color:var(--acc9)}
.tl{grid-template-columns:minmax(0,1fr) auto}
.hc{border-top:1px solid var(--line)}
.hc.good b{color:var(--acc6)}.hc.warn b{color:var(--warn)}.hc.bad b{color:var(--crit)}.hc.mute b{color:var(--muted)}
.find .a{color:var(--ink)}
.find.bad .a{color:var(--crit)}
.kpi[data-f="cash"] .v{color:var(--ink)}
/* icons */
.tabs .step .n{width:auto;height:auto;background:none!important;color:var(--fam,var(--ui));display:inline-flex}
.tabs .step .n .ico{display:block}
.kpi .l{display:flex;align-items:center;gap:6px}.kpi .l .ico{color:var(--fam,var(--muted));flex:none}
.waiting b{display:inline-flex;align-items:center;gap:6px}.waiting b .ico{color:var(--crit)}
.wchip{display:inline-flex;align-items:center;gap:6px}.wchip>.ico{color:var(--muted)}
.find .t{display:flex;align-items:flex-start;gap:6px}.fi{flex:none;display:inline-flex;margin-top:3px;color:var(--muted)}
.find.bad .fi{color:var(--crit)}.find.warn .fi{color:var(--warn)}
h2.ih{display:flex;align-items:center;gap:8px}h2.ih .ico{color:var(--ui)}
.hc .ico{opacity:.9}.hc.good .ico{color:var(--acc6)}.hc.warn .ico{color:var(--warn)}.hc.bad .ico{color:var(--crit)}.hc.mute .ico{color:var(--muted)}
.alr{justify-content:flex-start}.alr .ai{display:inline-flex;flex:none}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.fgrid{grid-template-columns:1fr}}
.flist{display:flex;flex-direction:column;gap:2px}
.fr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fr small{display:block;font-size:11.5px;color:var(--muted)}
.fr b{font-weight:600;white-space:nowrap}.fr b.pay{color:var(--out)}
.fr.tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:9px;font-weight:600}.fr.tot b{font-size:20px}
/* project card */
.pc2{gap:10px}
.pc2 .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc2 h3{font-size:15px;color:var(--ui);line-height:1.35}
.pc2 .sub{font-size:12px;color:var(--muted)}
.money2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.m-l{font-size:12px;color:var(--muted)}
.m-v{font-size:22px;font-weight:600;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.m-v.acc{color:var(--acc9)}
.pfb{border-inline-start:1px solid var(--line);padding-inline-start:12px;min-width:88px}
.pfb .m-v{color:var(--acc6)}.pfb.loss .m-l,.pfb.loss .m-v{color:var(--neg)}.pfb.na .m-v{color:var(--muted);font-weight:400}
.dual{display:grid;grid-template-columns:auto minmax(0,1fr) 40px;gap:3px 8px;align-items:center;font-size:11.5px;color:var(--muted)}
.dual .tr{height:6px;background:var(--ring-track);border-radius:3px;overflow:hidden}
.dual .tr i{display:block;height:100%;border-radius:3px}
.dual .v{font-weight:600;text-align:end;font-variant-numeric:tabular-nums}
.dual .v.e{color:var(--eng6)}.dual .v.a{color:var(--acc6)}
.alr{font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;gap:6px;align-items:center;line-height:1.4}
.alr.bad{background:var(--crit1);color:var(--crit)}.alr.warn{background:var(--warn1);color:var(--warn)}
.alr .more{font-size:11px;background:var(--surface);border-radius:8px;padding:0 6px;flex:none;direction:ltr}
.pgrid{gap:12px}
