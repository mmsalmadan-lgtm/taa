/* «طاولة الرسم» — the office's drafting table: a cool concrete page, white working surfaces, the company's navy for text and
   action, its red only in the mark. Colour carries meaning, never decoration: accounting = ledger green, engineering =
   blueprint blue, alerts = red / amber (an alert never colours a number). Readex Pro for headings and big figures, IBM Plex
   Sans Arabic for reading. Desk: a fixed side navigation; phone: a top bar and a sideways section strip. */
:root{
 --bg:#F1F3F4;--surface:#FFFFFF;--sunk:#F5F7F8;--ink:#1D2533;--muted:#5B6474;--faint:#646D7A;--line:#E3E7EA;--line-2:#D4DAE0;--field:#CBD2D9;--field-in:#828B97;
 --ui:#1D2533;--ui-2:#34425C;--ui-1:#E9EDF3;--brand:#C62026;
 --eng9:#123F78;--eng6:#2F6FCB;--eng1:#E6EEF9;
 --acc9:#0E5A3A;--acc6:#1D8456;--acc1:#E2F2E9;--out:#4A5565;--neg:#A3241B;
 --crit:#B42318;--crit1:#FDECEA;--warn:#8A5300;--warn6:#D08A12;--warn1:#FDF1DA;--track:#E7EBEE;
 --on-acc:#FFFFFF;
 --f-text:"SAR","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
 --f-disp:"SAR","Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
 --r-s:8px;--r-m:12px;--r-l:16px;
 --sh-lift:0 10px 24px -14px rgb(29 37 51/.28);--sh-pop:0 28px 70px -20px rgb(29 37 51/.42);
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.5,1);
 color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ui);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:60;background:var(--ui);color:var(--on-acc);padding:10px 16px;border-radius:var(--r-s);font-weight:600;text-decoration:none}.skip:focus{top:12px}
@media (pointer:coarse){.f input,.f select,.pbtn,.qa summary,.sbtn,.ibtn,.ebtn,.wchip,.chip,.sub-tabs button,.tab{min-height:44px}.lnk,a.wa{min-height:44px;display:inline-flex;align-items:center}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;letter-spacing:0}
.wrapx{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== shell: side navigation on a desk, top bar + section strip on a phone ===== */
.side{display:contents}
.gh{background:var(--surface);border-bottom:1px solid var(--line)}
.gh .wrapx{display:flex;align-items:center;gap:12px;flex-wrap:wrap;row-gap:8px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;font-family:var(--f-disp);font-weight:700;display:grid;place-items:center;font-size:19px;flex:none;line-height:1}
.gh-t{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1}
.gh-t b{font-family:var(--f-disp);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--warn1);color:var(--warn);white-space:nowrap;font-weight:600}
.badge.ok{background:var(--acc1);color:var(--acc9)}.badge.bad{background:var(--crit1);color:var(--crit)}
.gh-a{display:flex;gap:4px;flex-basis:100%;flex-wrap:wrap}.gh-a:empty{display:none}
.ibtn{border:0;background:transparent;color:var(--muted);border-radius:var(--r-s);padding:6px 10px;font-weight:500;font-size:13px;transition:background .15s,color .15s}
.ibtn:hover{background:var(--sunk);color:var(--ink)}
.tabs{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs .wrapx{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:8px}.tabs .wrapx::-webkit-scrollbar{display:none}
.tgrp{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);padding:7px 12px;font-size:14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500;transition:background .18s var(--ease),color .18s}
.tab svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab[aria-current="page"]{background:var(--ui);color:var(--on-acc)}
.tab .n{background:var(--crit);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px;font-weight:700;font-family:var(--f-text)}
.tab[aria-current="page"] .n{background:#fff;color:var(--crit)}
main:focus{outline:none}
main{padding-block:22px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
footer{color:var(--faint);font-size:12px;line-height:1.7;padding:8px 16px 32px;max-width:1240px;margin:0 auto;width:100%}
footer::before{content:"";display:block;height:1px;background:var(--line);margin-bottom:14px}
body:has(#tabs[hidden]) .gh{display:none}body:has(#tabs[hidden]) main{padding-top:8px}
@media (min-width:1080px){
 body{display:grid;grid-template-columns:264px minmax(0,1fr);grid-template-rows:1fr auto;grid-template-areas:"side main" "side foot";min-height:100dvh}
 .side{display:flex;flex-direction:column;grid-area:side;position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--surface);border-inline-end:1px solid var(--line);scrollbar-width:thin}
 main.wrapx{grid-area:main;padding:36px 48px 40px;max-width:1280px;width:100%;margin:0}
 footer{grid-area:foot;margin:0;padding:0 48px 32px;max-width:1280px}
 .gh{border-bottom:0;background:transparent}
 .gh .wrapx{flex-direction:column;align-items:stretch;padding:22px 18px 10px;gap:14px}
 .gh .badge{align-self:flex-start}
 .gh-a{gap:2px;margin-inline:-10px}
 .tabs{position:static;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;flex:1}
 .tabs .wrapx{flex-direction:column;overflow:visible;padding:6px 12px 24px;gap:2px}
 .tgrp{display:block;font-size:12px;color:var(--faint);padding:16px 12px 6px;font-weight:500}
 .tab{border-radius:var(--r-s);padding:9px 12px;width:100%;font-size:14.5px}
 .tab:hover{background:var(--sunk)}
 .tab[aria-current="page"]{background:var(--ui-1);color:var(--ink);font-weight:600}
 .tab[aria-current="page"] svg{stroke:var(--fam,var(--ink))}
 .tab .n{margin-inline-start:auto}.tab[aria-current="page"] .n{background:var(--crit);color:#fff}
 body:has(#tabs[hidden]){display:block}body:has(#tabs[hidden]) .side{position:static;height:auto;border:0;background:transparent}
 body:has(#tabs[hidden]) .gh{display:none}
}
.reload-spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ===== page heads: one large title, its family marked by a rule ===== */
.ph{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding-inline-start:16px;border-inline-start:3px solid var(--fam,var(--ui));margin-block:4px 6px}
.ph .ic{display:none}
.ph h1{margin:0;font-size:clamp(23px,2.6vw,31px);line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.ph .sub{color:var(--muted);font-size:14px;margin-top:4px;max-width:72ch}
.ph .grow{flex:1;min-width:0}
.ph .pcode{font-size:13px;vertical-align:5px}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:14px 2px -4px}
.sec-h h2{margin:0;font-size:18px;font-weight:600}
.sec-h .c{color:var(--muted);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:20px;font-variant-numeric:tabular-nums}
.sec-h .note{color:var(--muted);font-size:13px;flex-basis:100%;max-width:80ch}

/* ===== figures ===== */
.kpis{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.kpi{flex:1 1 180px;padding:16px 18px 15px;position:relative;min-width:0;box-shadow:-1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:18px;width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--fam,transparent)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-size:23px;font-weight:600;line-height:1.3;margin-top:2px;color:var(--vc,var(--ink));overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi[data-f="in"]{--fam:var(--acc6);--vc:var(--acc9)}.kpi[data-f="out"]{--fam:var(--out);--vc:var(--out)}.kpi[data-f="cash"]{--fam:var(--acc6)}
.kpi[data-f="eng"]{--fam:var(--eng6);--vc:var(--eng9)}.kpi[data-t="warn"]{--fam:var(--warn6)}.kpi[data-t="bad"]{--fam:var(--crit)}
.flag{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px}.flag.warn{background:var(--warn1);color:var(--warn)}.flag.bad{background:var(--crit1);color:var(--crit)}
.kpi.dep,.fcbox.dep,.ldg .dep{opacity:.55}

/* the money ledger on home: what comes in, what goes out, the cash */
.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ldg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px 8px;display:flex;flex-direction:column;min-width:0}
.ldg>h2{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;font-family:var(--f-text)}
.ldg>h2 i{width:8px;height:8px;border-radius:50%;background:var(--fam);display:inline-block}
.ldg[data-f="in"]{--fam:var(--acc6);--vc:var(--acc9)}.ldg[data-f="out"]{--fam:var(--out);--vc:var(--out)}.ldg[data-f="cash"]{--fam:var(--ink);--vc:var(--ink)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.ldg>h2+.lrow{border-top:0}
.lrow .l{font-size:13.5px}.lrow .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
.lrow .v{font-family:var(--f-disp);font-size:20px;font-weight:600;color:var(--vc);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:end}
.lrow .flag{grid-column:1/-1;justify-self:start;margin-top:2px}
.lrow.lead .v{font-size:27px}
@media (max-width:640px){.ledger{grid-template-columns:1fr}}@media (min-width:641px) and (max-width:1279px){.ldg{padding:14px 14px 6px}.lrow .v{font-size:17px}.lrow.lead .v{font-size:21px}}

/* ===== record cards ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;align-items:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:start;color:var(--ink);position:relative;transition:border-color .18s,box-shadow .22s var(--ease),transform .22s var(--ease)}
button.card{cursor:pointer;font:inherit}
@media (hover:hover){button.card:hover,.sc>summary:hover,.tl:hover,.al1:hover,.hc:hover,.step:hover{border-color:var(--line-2);box-shadow:var(--sh-lift)}}
button.card:active,.tl:active,.al1:active,.step:active{transform:scale(.985)}
.card.warn::after,.card.bad::after,.sc.warn::after,.sc.bad::after{content:"";position:absolute;inset-inline-start:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--warn6)}
.card.bad::after,.sc.bad::after{background:var(--crit)}
.card .t{font-family:var(--f-disp);font-weight:600;font-size:15.5px;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
.card .st{font-size:12.5px;color:var(--muted);margin-top:-7px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px}.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:end;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fam-acc .kv b{color:var(--acc9)}.fam-eng .kv b{color:var(--eng9)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);max-width:100%;overflow-wrap:anywhere;line-height:1.55;border:1px solid var(--line)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}

/* project card */
.pc .mid{display:flex;align-items:center;gap:14px}
.ring{flex:none}.ring text{font-family:var(--f-text);font-weight:600;font-size:13.5px;fill:var(--ink)}
.amt{font-family:var(--f-disp);font-size:21px;font-weight:600;color:var(--acc9);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.25}.amt-l{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc6);border-radius:3px;transition:width .6s var(--ease)}
.pcode{display:inline-block;font:600 11.5px/1.65 var(--f-text);direction:ltr;background:var(--ui-1);color:var(--ui-2);border-radius:6px;padding:0 7px;margin-inline-end:7px;vertical-align:2px;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ===== search and filters (browsing projects, documents, quote requests) ===== */

.sfield{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:999px;padding:0 16px;background:var(--surface);transition:border-color .15s,box-shadow .2s}

.chip[aria-pressed="true"]{background:var(--ui);border-color:var(--ui);color:var(--on-acc)}.chip[aria-pressed="true"] .k{color:color-mix(in srgb,var(--on-acc) 70%,transparent)}
.chip:active{transform:scale(.96)}
.search,.srch{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .2s}
.search:focus,.srch:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px var(--ui-1)}
.ltools{align-items:center;gap:10px}
.docf{margin-bottom:12px}.doc .dhd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px}.doc .dhd>*{white-space:nowrap}.doc .dno{font-variant-numeric:tabular-nums;direction:ltr;text-align:start;color:var(--ink)}.doc .sbtn{align-self:flex-start;margin-top:auto}.doc .ref{white-space:nowrap;font-variant-numeric:tabular-nums}
.lead .dhd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}.lead .dhd .small{margin-inline-start:auto}.lead .ref{font-variant-numeric:tabular-nums;font-weight:600}.lead .st a{color:var(--ink)}.lbtn{gap:6px}
.ldet summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:13px;min-height:32px;display:flex;align-items:center;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}.ldet .lh{font-size:12px;color:var(--muted);margin:8px 0 2px}.ldet ul{margin:0;padding-inline-start:18px;font-size:13px}.ldet a{color:var(--ink)}.ldet .ref{white-space:nowrap}

/* ===== segmented sub-tabs and the record page ===== */
.back{align-self:flex-start;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:8px 2px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-s);transition:color .15s}
.back:hover{color:var(--ink)}
@media (pointer:coarse){.back{min-height:44px}}
.sub-tabs{display:flex;gap:2px;background:color-mix(in srgb,var(--ink) 6%,var(--bg));border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;align-self:flex-start;max-width:100%}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tabs button{border:0;background:transparent;padding:8px 15px;border-radius:9px;color:var(--muted);white-space:nowrap;font-weight:500;font-size:14px;transition:background .2s var(--ease),color .2s,box-shadow .2s}
.sub-tabs button:hover{color:var(--ink)}
.sub-tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(29 37 51/.08),0 2px 8px -4px rgb(29 37 51/.18)}
.mtabs{margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .box{border-color:var(--line)}
.inst{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px}

button.inst.ed{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:start;cursor:pointer;border-radius:6px;transition:background .15s}button.inst.ed:hover{background:var(--sunk)}
.ebar{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px;padding:5px 0}
.ebar .bar{height:10px;border-radius:5px}.ebar .bar i{background:var(--out)}.ebar b{font-variant-numeric:tabular-nums;white-space:nowrap}
.notes{white-space:pre-wrap;font-size:14px;line-height:1.85;background:var(--sunk);border-radius:var(--r-m);padding:14px 16px;max-width:82ch}
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:start;color:var(--ink)}
.al:last-child{border-bottom:0}.al i{align-self:stretch;border-radius:2px;background:var(--warn6)}.al.bad i{background:var(--crit)}
.al .x{font-size:12px;color:var(--muted)}.al b{font-weight:600;white-space:nowrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;min-width:0}.box .kv{max-width:440px}
.kbox{display:flex;flex-direction:column;gap:8px}.kh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.kh b{font-family:var(--f-disp);color:var(--ink);font-size:16px;font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kgrid>div{display:flex;flex-direction:column;background:var(--sunk);border-radius:var(--r-s);padding:9px 12px}
.kgrid span{font-size:12px;color:var(--muted)}.kgrid b{font-family:var(--f-disp);font-size:17px;font-weight:600}.kgrid small{font-size:12px;color:var(--muted)}
.knote{white-space:pre-wrap;font-size:13px;background:var(--warn1);border-radius:var(--r-s);padding:9px 12px;color:var(--ink)}

/* project overview */

.ovtodo ul{margin:0;padding-inline-start:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 28px}.ovtodo li{font-weight:500}.ovtodo li span{display:block;font-size:12px;color:var(--muted);font-weight:400}
@media (max-width:760px){.ovg{grid-template-columns:1fr}}
.qa td.wrap,td.wrap{white-space:normal;text-align:start;direction:rtl}

/* ===== sign-in: one calm card, step by step the first time ===== */

.msg h1{font-size:22px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px}
.login{display:inline-block;margin:14px 0 6px;background:var(--ui);color:#fff;text-decoration:none;font-weight:600;font-size:16px;padding:12px 22px;border-radius:var(--r-s)}
.authw{max-width:420px;margin:clamp(24px,8vh,80px) auto 24px;display:flex;flex-direction:column;gap:18px}
.abrand{display:flex;align-items:center;gap:12px;padding-inline:4px}.abrand .logo{width:44px;height:44px;font-size:23px;border-radius:12px}

.auth{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px 20px;box-shadow:0 1px 0 rgb(29 37 51/.03)}

.aprog{display:flex;gap:6px;margin:-4px 0 18px}.aprog i{flex:1;height:5px;border-radius:3px;background:var(--track);overflow:hidden;position:relative}
.aprog i::after{content:"";position:absolute;inset:0;background:var(--acc6);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--spring)}
.aprog i.on::after{transform:scaleX(1)}
.auth.stepped{counter-reset:st}.auth.stepped .f>label{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.auth.stepped .f>label::before{counter-increment:st;content:counter(st);width:22px;height:22px;border-radius:50%;background:var(--ui-1);color:var(--ui-2);font-size:12px;font-weight:700;display:inline-grid;place-items:center;transition:background .25s,color .25s}
.auth.stepped .f.ok>label::before{content:"✓";background:var(--acc6);color:#fff}
.auth .f input,.dlg .f input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--field-in);border-radius:var(--r-s);background:var(--surface);color:var(--ink);direction:ltr;text-align:start;letter-spacing:.06em;transition:border-color .15s,box-shadow .2s}
.auth .f input:focus,.dlg .f input:focus,.f select:focus,.dlg textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px var(--ui-1)}
.auth .pbtn{width:100%;min-height:48px;font-size:16px;margin-top:6px}
.auth .alt{display:block;width:100%;margin-top:12px;background:none;border:0;color:var(--ink);font:inherit;font-weight:600;font-size:14px;min-height:44px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:5px}
.auth .wa{display:block;text-align:center;margin-top:4px;color:var(--muted);font-size:13px}
.code{direction:ltr;font-family:var(--f-disp);font-size:30px;font-weight:600;letter-spacing:.12em;text-align:center;background:var(--sunk);border-radius:var(--r-m);padding:14px 8px;margin:10px 0;user-select:all}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}

/* ===== cash, ledgers, subcontractors, suppliers ===== */
.qc{margin-top:12px;display:flex;flex-direction:column;gap:6px}.qc p{margin:0;font-size:12.5px;padding:7px 11px;border-radius:var(--r-s);background:var(--sunk)}
.qc p.bad{background:var(--crit1);color:var(--crit)}.qc p.warn{background:var(--warn1);color:var(--warn)}
.qa{margin-top:10px}.qa summary{cursor:pointer;font-size:13px;color:var(--ink);font-weight:600;min-height:32px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}@media (pointer:coarse){.qa>summary{min-height:44px;padding-top:12px}}
.qa table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.qa td{padding:7px 4px;border-bottom:1px solid var(--line)}.qa td:last-child{text-align:end;white-space:nowrap;direction:ltr;font-variant-numeric:tabular-nums}
.qa td.neg{color:var(--crit)}
.scs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px;align-items:start}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);min-width:0;position:relative}
.sc>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-l);border:1px solid transparent;margin:-1px;transition:box-shadow .22s var(--ease),border-color .18s}.sc>summary::-webkit-details-marker{display:none}
.sc .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.sc .hd b{font-family:var(--f-disp);font-size:16.5px;font-weight:600;color:var(--ink)}.sc .hd span{font-size:12px;color:var(--muted)}
.sc .hd .tg{margin-inline-start:auto;font-size:12.5px;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.sc .hd .tg::after{content:"";width:7px;height:7px;border-inline-end:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .25s var(--ease)}
.sc[open] .hd .tg::after{transform:rotate(225deg) translateY(-2px)}
.sc .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sc .nums div{background:var(--sunk);border-radius:var(--r-s);padding:8px 10px;min-width:0}.sc .nums small{display:block;font-size:11.5px;color:var(--muted)}
.sc .nums b{font-family:var(--f-disp);font-size:15px;font-weight:600;white-space:nowrap}.sc .nums .pos{color:var(--acc9)}
.sc .al{display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:0;border:0}.sc .al p{text-align:start}

.sp .bar.over i,.bar.over i{background:var(--crit)}
.sp .ln{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}.sp .ln b{color:var(--ink);font-weight:600}

.skel{height:120px;border-radius:var(--r-l);background:linear-gradient(90deg,var(--line) 0%,var(--surface) 40%,var(--line) 80%);background-size:300% 100%;animation:shimmer 1.4s ease-in-out infinite}

@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ===== home ===== */
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
.hero .date{font-size:13px;color:var(--muted)}
.hero h1{margin:0;font-size:clamp(26px,3.4vw,38px);line-height:1.2;font-weight:600}
.hero p{margin:4px 0 0;font-size:16px;color:var(--muted);max-width:68ch;line-height:1.7}
.hero p b{color:var(--ink);font-weight:600}.hero p .bad{color:var(--crit)}
.steps-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px 10px}
.steps-box>h2{margin:0;font-size:16px;font-weight:600}.steps-box>p{margin:2px 0 8px;font-size:13px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;counter-reset:step;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;gap:12px;align-items:center;padding:12px 6px;margin:0 -6px;border:1px solid transparent;border-radius:var(--r-m);background:none;text-align:start;color:var(--ink);font:inherit;cursor:pointer;transition:background .15s,box-shadow .22s var(--ease),border-color .18s,transform .2s var(--ease);width:calc(100% + 12px)}
.steps li+li{border-top:1px solid var(--line)}
.step::before{counter-increment:step;content:counter(step);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--ui-1);color:var(--ui-2)}
.step.first::before{background:var(--ui);color:var(--on-acc)}
.step .tx{display:flex;flex-direction:column;min-width:0}.step .tx b{font-weight:600;font-size:14.5px}.step .tx small{color:var(--muted);font-size:12.5px}
.step .cnt{font-family:var(--f-disp);font-weight:600;font-size:15px;background:var(--crit1);color:var(--crit);border-radius:999px;min-width:30px;padding:0 9px;text-align:center;line-height:26px}
.step .cnt.go{background:var(--ui);color:var(--on-acc);font-family:var(--f-text);font-size:13px;padding:0 12px}
.step .chev{width:8px;height:8px;border-left:1.8px solid var(--faint);border-bottom:1.8px solid var(--faint);transform:rotate(45deg);justify-self:center}
.steps-done{display:flex;align-items:center;gap:10px;color:var(--acc9);font-weight:500;padding:6px 0 8px}
.fcbox{display:flex;flex-direction:column;gap:8px}.fch2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.fch2>b:first-child{font-family:var(--f-disp);font-size:17px;font-weight:600}
.links{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:2px}
.lnk{border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;padding:6px 0;cursor:pointer;text-align:start;text-decoration:underline;text-decoration-color:var(--line-2);text-decoration-thickness:1.5px;text-underline-offset:5px;transition:text-decoration-color .15s}
.lnk:hover{text-decoration-color:var(--ink)}
