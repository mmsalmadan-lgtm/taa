<!doctype html>
<html lang="ar" dir="rtl"> 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>لوحة المتابعة — طاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F5F2; --card: #FFFFFF; --ink: #1C2321; --muted: #5B6461; --line: #E2E4DF; --line2: #EEF0EC; --brand: #0E5A5F; --nav: #12312F;
    --ok-bg: #E8F1E8; --ok: #2F5A33; --warn-bg: #FFF1E6; --warn: #8A3A0A; --bad-bg: #F8E8E6; --bad: #8E2A1E; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; font-size: 15px; }
  header { background: var(--nav); color: #fff; padding: 20px 16px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 22px; }
  header .sub { color: #C9D7D3; font-size: 14px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .mode { background: #FFF1E6; color: #8A3A0A; }
  .mode.ok { background: #E8F1E8; color: #2F5A33; }
  .mode.bad { background: #F8E8E6; color: #8E2A1E; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 9px 16px; min-height: 40px; cursor: pointer; border: 1px solid #2A5552; background: #1F4A47; color: #fff; }
  main { padding: 20px 16px 48px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  section h2 { margin: 0; font-size: 18px; }
  .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .note { color: var(--muted); font-size: 13px; }
  .count { color: var(--muted); font-size: 14px; font-weight: 500; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi .s { color: var(--muted); font-size: 12px; }
  .kpi.warn .v { color: #A3470C; } .kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); }
  .tbl { overflow-x: auto; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  th { text-align: right; font-weight: 500; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
  td:first-child { font-weight: 600; }
  .tag { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 600; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .msg { max-width: 520px; margin: 60px auto; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 20px; }
  .msg h1 { font-size: 20px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .skel { height: 120px; border-radius: 12px; background: linear-gradient(90deg, #ECEEEA, #F6F7F4, #ECEEEA); margin-bottom: 18px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 28px; }
</style>
</head>
<body>
<header><div class="wrap row">
  <div><h1 id="who">لوحة المتابعة</h1><div class="sub" id="roles">مؤسسة طاء الرائدة للمقاولات العامة</div></div>
  <div class="chips"><span class="chip mode" id="mode" hidden></span><span class="sub" id="at"></span><button type="button" id="reload" hidden>تحديث</button></div>
</div></header>
<main class="wrap" id="main"><div class="skel"></div><div class="skel"></div></main>
<footer>للمتابعة فقط — كل إجراء (اعتماد، رفض، صرف) يتم من البوت في واتساب. الرابط شخصي، لا تحوّله لأحد.</footer>
<script>
const API = "https://zkbwrgulnsycqqfbwkee.supabase.co/functions/v1/bird-webhook/dash";
const token = decodeURIComponent((location.hash || "").slice(1));
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

function fail(title, text) {
  const m = $("main"); m.replaceChildren();
  const box = el("div", "msg"); box.append(el("h1", "", title), el("p", "muted", text)); m.append(box);
}
function cell(c) {
  const td = el("td");
  if (c && typeof c === "object") { const s = el("span", c.tone ? "tag " + c.tone : "", c.t); td.append(s); }
  else td.textContent = c == null ? "" : String(c);
  return td;
}
function render(d) {
  $("who").textContent = d.name;
  $("roles").textContent = d.roles.join(" · ");
  const m = $("mode"); m.hidden = false; m.textContent = "الوضع: " + d.mode;
  m.className = "chip mode" + (d.mode === "فعلي" ? " ok" : d.mode === "إيقاف آمن" ? " bad" : "");
  $("at").textContent = "آخر تحديث " + new Date(d.at).toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit" });
  $("reload").hidden = false;
  const main = $("main"); main.replaceChildren();
  for (const s of d.sections) {
    const sec = el("section"); sec.id = "s-" + s.id;
    const head = el("div", "head"), h = el("h2", "", s.title);
    if (s.table) h.append(el("span", "count", "  (" + s.table.rows.length + ")"));
    head.append(h); if (s.note) head.append(el("div", "note", s.note)); sec.append(head);
    if (s.kpis) {
      const g = el("div", "kpis");
      for (const k of s.kpis) { const b = el("div", "kpi" + (k.tone ? " " + k.tone : "")); b.append(el("div", "l", k.label), el("div", "v", k.value)); if (k.sub) b.append(el("div", "s", k.sub)); g.append(b); }
      sec.append(g);
    }
    if (s.table) {
      if (!s.table.rows.length) sec.append(el("div", "empty", s.empty || "لا شيء"));
      else {
        const wrap = el("div", "tbl"), t = el("table"), thead = el("thead"), tr = el("tr");
        for (const c of s.table.cols) tr.append(el("th", "", c));
        thead.append(tr); t.append(thead);
        const tb = el("tbody");
        for (const r of s.table.rows) { const row = el("tr"); for (const c of r) row.append(cell(c)); tb.append(row); }
        t.append(tb); wrap.append(t); sec.append(wrap);
      }
    }
    main.append(sec);
  }
}
async function load() {
  if (!token) return fail("الرابط غير مكتمل", "اطلب «لوحة المتابعة» من قائمة البوت في واتساب.");
  try {
    const r = await fetch(API, { headers: { "x-form-token": token } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return fail(r.status === 401 ? "انتهت صلاحية الرابط" : r.status === 403 ? "غير مصرح" : "تعذّر التحميل", j.error || "حاول مرة أخرى بعد قليل.");
    render(j);
  } catch (e) { fail("تعذّر الاتصال", "تحقق من الإنترنت ثم اضغط تحديث."); $("reload").hidden = false; }
}
$("reload").addEventListener("click", load);
load();
setInterval(() => { if (document.visibilityState === "visible") load(); }, 120000);
</script>
</body>
</html>
