<!doctype html>
<html lang="ar" dir="rtl"> 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>لوحة المتابعة — طاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F5F2; --card: #FFFFFF; --ink: #1C2321; --muted: #5B6461; --line: #E2E4DF; --line2: #EEF0EC; --brand: #0E5A5F; --nav: #12312F;
    --ok-bg: #E8F1E8; --ok: #2F5A33; --warn-bg: #FFF1E6; --warn: #8A3A0A; --bad-bg: #F8E8E6; --bad: #8E2A1E; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; font-size: 15px; }
  header { background: var(--nav); color: #fff; padding: 20px 16px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 22px; }
  header .sub { color: #C9D7D3; font-size: 14px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .mode { background: #FFF1E6; color: #8A3A0A; }
  .mode.ok { background: #E8F1E8; color: #2F5A33; }
  .mode.bad { background: #F8E8E6; color: #8E2A1E; }
  button { font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 9px 16px; min-height: 40px; cursor: pointer; border: 1px solid #2A5552; background: #1F4A47; color: #fff; }
  main { padding: 20px 16px 48px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  section h2 { margin: 0; font-size: 18px; }
  .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .note { color: var(--muted); font-size: 13px; }
  .count { color: var(--muted); font-size: 14px; font-weight: 500; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .kpi .l { color: var(--muted); font-size: 13px; }
  .kpi .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi .s { color: var(--muted); font-size: 12px; }
  .kpi.warn .v { color: #A3470C; } .kpi.bad .v { color: var(--bad); } .kpi.ok .v { color: var(--ok); }
  .tbl { overflow-x: auto; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  th { text-align: right; font-weight: 500; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
  td:first-child { font-weight: 600; }
  .tag { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 600; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .msg { max-width: 520px; margin: 60px auto; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 20px; }
  .msg h1 { font-size: 20px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .skel { height: 120px; border-radius: 12px; background: linear-gradient(90deg, #ECEEEA, #F6F7F4, #ECEEEA); margin-bottom: 18px; }
  .login { display: inline-block; margin: 14px 0 6px; background: #1F7A4D; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; padding: 12px 22px; border-radius: 10px; }
  .login:hover { background: #17633E; color: #fff; }
  .small { font-size: 13px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 28px; }
  .tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
  .tab { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .tab.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn2 { background: #fff; color: var(--ink); border: 1px solid #D3D7D1; }
  .btn-sm { padding: 6px 12px; min-height: 36px; font-size: 13px; }
  dialog { border: 0; border-radius: 14px; padding: 0; width: min(720px, 96vw); max-height: 92vh; }
  dialog::backdrop { background: rgba(18,49,47,.45); }
  .dlg { padding: 20px; overflow: auto; max-height: 92vh; }
  .dlg h3 { margin: 0 0 12px; font-size: 18px; }
  .fg { margin: 14px 0 4px; font-weight: 700; color: var(--brand); font-size: 14px; }
  .f { margin-bottom: 12px; }
  .f label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .f input[type=text], .f input[type=number], .f input[type=tel], .f select { width: 100%; font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #D3D7D1; border-radius: 8px; background: #fff; }
  .f .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .multi { display: flex; flex-wrap: wrap; gap: 6px; }
  .multi label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #D3D7D1; border-radius: 999px; padding: 6px 12px; color: var(--ink); font-size: 14px; margin: 0; cursor: pointer; }
  .multi input:checked + span { font-weight: 700; color: var(--brand); }
  tr.click { cursor: pointer; } tr.click:hover td { background: #F7F8F5; }
  .items td:first-child { width: 40%; min-width: 160px; }
  .items td { padding: 4px; border: 0; } .items input { width: 100%; font-family: inherit; font-size: 14px; padding: 8px; border: 1px solid #D3D7D1; border-radius: 6px; }
  .items input:disabled { background: #F1F2EF; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; margin-top: 16px; }
  .res { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: none; }
  .res.ok { display: block; background: var(--ok-bg); color: var(--ok); } .res.warn { display: block; background: var(--warn-bg); color: var(--warn); } .res.bad { display: block; background: var(--bad-bg); color: var(--bad); }
</style>
</head>
<body>
<header><div class="wrap row">
  <div><h1 id="who">لوحة المتابعة</h1><div class="sub" id="roles">مؤسسة طاء الرائدة للمقاولات العامة</div></div>
  <div class="chips"><span class="chip mode" id="mode" hidden></span><span class="sub" id="at"></span><button type="button" id="reload" hidden>تحديث</button></div>
</div></header>
<nav class="wrap tabs" id="tabs" hidden><button type="button" class="tab on" data-v="mon">المتابعة</button><button type="button" class="tab" data-v="data">البيانات</button></nav>
<main class="wrap" id="main"><div class="skel"></div><div class="skel"></div></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<footer>الاعتماد والرفض والصرف من البوت في واتساب. تعديل الأشخاص والمشاريع والعقود وبيانات الدفع يُنفَّذ بعد ضغط «تأكيد» في واتساب. الرابط شخصي، لا تحوّله لأحد.</footer>
<script>
const API = "https://zkbwrgulnsycqqfbwkee.supabase.co/functions/v1/bird-webhook/dash";
const token = decodeURIComponent((location.hash || "").slice(1));
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

const BOT = "966551313729";
function fail(title, text) {
  const m = $("main"); m.replaceChildren();
  const box = el("div", "msg"); box.append(el("h1", "", title), el("p", "muted", text));
  const a = el("a", "login", "تسجيل الدخول عبر واتساب"); a.href = "https://wa.me/" + BOT + "?text=" + encodeURIComponent("لوحة المتابعة");
  box.append(a, el("p", "muted small", "يفتح واتساب برسالة «لوحة المتابعة» جاهزة — أرسلها، ويرد عليك البوت برابط لوحتك (صالح 12 ساعة). من الكمبيوتر: استخدم واتساب ويب."));
  m.append(box);
}
function cell(c) {
  const td = el("td");
  if (c && typeof c === "object") { const s = el("span", c.tone ? "tag " + c.tone : "", c.t); td.append(s); }
  else td.textContent = c == null ? "" : String(c);
  return td;
}
function render(d) {
  $("who").textContent = d.name;
  $("roles").textContent = d.roles.join(" · ");
  const m = $("mode"); m.hidden = false; m.textContent = "الوضع: " + d.mode;
  m.className = "chip mode" + (d.mode === "فعلي" ? " ok" : d.mode === "إيقاف آمن" ? " bad" : "");
  $("at").textContent = "آخر تحديث " + new Date(d.at).toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit" });
  $("reload").hidden = false;
  const main = $("main"); main.replaceChildren();
  for (const s of d.sections) {
    const sec = el("section"); sec.id = "s-" + s.id;
    const head = el("div", "head"), h = el("h2", "", s.title);
    if (s.table) h.append(el("span", "count", "  (" + s.table.rows.length + ")"));
    head.append(h); if (s.note) head.append(el("div", "note", s.note)); sec.append(head);
    if (s.kpis) {
      const g = el("div", "kpis");
      for (const k of s.kpis) { const b = el("div", "kpi" + (k.tone ? " " + k.tone : "")); b.append(el("div", "l", k.label), el("div", "v", k.value)); if (k.sub) b.append(el("div", "s", k.sub)); g.append(b); }
      sec.append(g);
    }
    if (s.table) {
      if (!s.table.rows.length) sec.append(el("div", "empty", s.empty || "لا شيء"));
      else {
        const wrap = el("div", "tbl"), t = el("table"), thead = el("thead"), tr = el("tr");
        for (const c of s.table.cols) tr.append(el("th", "", c));
        thead.append(tr); t.append(thead);
        const tb = el("tbody");
        for (const r of s.table.rows) { const row = el("tr"); for (const c of r) row.append(cell(c)); tb.append(row); }
        t.append(tb); wrap.append(t); sec.append(wrap);
      }
    }
    main.append(sec);
  }
}
async function load() {
  if (!token) return fail("لوحة المتابعة", "لموظفي مؤسسة طاء الرائدة للمقاولات العامة. الدخول برقم جوالك المسجل في النظام.");
  try {
    const r = await fetch(API, { headers: { "x-form-token": token } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return fail(r.status === 401 ? "انتهت صلاحية الرابط" : r.status === 403 ? "غير مصرح" : "تعذّر التحميل", j.error || "حاول مرة أخرى بعد قليل.");
    render(j);
  } catch (e) { fail("تعذّر الاتصال", "تحقق من الإنترنت ثم اضغط تحديث."); $("reload").hidden = false; }
}
let view = "mon", REG = null;
async function api(body) {
  const r = await fetch(API, { method: "POST", headers: { "x-form-token": token, "content-type": "application/json" }, body: JSON.stringify(body) });
  return { status: r.status, j: await r.json().catch(() => ({})) };
}
async function loadReg() {
  const { status, j } = await api({ op: "reg" });
  REG = status === 200 ? j.ents : [];
  $("tabs").hidden = !REG.length;
}
function renderData() {
  const main = $("main"); main.replaceChildren();
  for (const e of REG) {
    const sec = el("section"), head = el("div", "head"), h = el("h2", "", e.title);
    h.append(el("span", "count", "  (" + e.rows.length + ")")); head.append(h);
    if (e.canAdd) { const b = el("button", "btn-sm", "+ إضافة"); b.type = "button"; b.onclick = () => openForm(e, null); head.append(b); }
    sec.append(head);
    if (e.confirm) sec.append(el("div", "note", "اضغط على أي سطر لتعديله. الحفظ يرسل لك زر «تأكيد» في واتساب، ولا يُنفَّذ قبله.")); else if (e.rows.length) sec.append(el("div", "note", "اضغط على أي سطر لتعديله."));
    if (!e.rows.length) sec.append(el("div", "empty", "لا توجد سجلات بعد"));
    else {
      const wrap = el("div", "tbl"), t = el("table"), tr = el("tr");
      for (const c of e.cols) tr.append(el("th", "", c)); tr.append(el("th", "", ""));
      const th = el("thead"); th.append(tr); t.append(th); const tb = el("tbody");
      for (const r of e.rows) {
        const row = el("tr"); for (const c of r.cells) row.append(cell(c));
        const td = el("td"); if (r.edit) { const b = el("button", "btn2 btn-sm", "تعديل"); b.type = "button"; b.onclick = (ev) => { ev.stopPropagation(); openForm(e, r); }; td.append(b); row.classList.add("click"); row.onclick = () => openForm(e, r); }
        row.append(td); tb.append(row);
      }
      t.append(tb); wrap.append(t); sec.append(wrap);
    }
    main.append(sec);
  }
}
function input(type, val) { const i = el("input"); i.type = type; i.value = val ?? ""; return i; }
function openForm(e, r) {
  const data = r ? JSON.parse(JSON.stringify(r.data)) : {};
  const body = $("dlgBody"); body.replaceChildren();
  body.append(el("h3", "", (r ? "تعديل — " : "إضافة — ") + e.title));
  const get = {}; let group = "";
  for (const f of e.fields) {
    if (f.group && f.group !== group) { group = f.group; body.append(el("div", "fg", group)); }
    const box = el("div", "f"), lab = el("label", "", f.label + (f.required ? " *" : "")); box.append(lab);
    const v = data[f.key];
    if (f.type === "text" || f.type === "phone" || f.type === "number") {
      const i = input(f.type === "number" ? "text" : f.type === "phone" ? "tel" : "text", v);
      if (f.type === "number") i.inputMode = "decimal";
      if (f.key === "name" && e.key === "projects" && r) i.disabled = true;
      if (f.key === "project" && r) i.disabled = true;
      box.append(i); get[f.key] = () => i.value;
    } else if (f.type === "select") {
      const sel = el("select"); for (const o of f.options || []) { const op = el("option", "", o.t); op.value = o.v; sel.append(op); }
      if (v !== undefined && v !== null) sel.value = v; else if (f.options && f.options[0]) sel.value = f.options[0].v;
      if (f.key === "project" && r) { if (![...sel.options].some((o) => o.value === v)) { const op = el("option", "", v); op.value = v; sel.append(op); sel.value = v; } sel.disabled = true; }
      box.append(sel); get[f.key] = () => sel.value;
    } else if (f.type === "multi") {
      const wrap = el("div", "multi"), chosen = new Set(v || []);
      for (const o of f.options || []) { const l = el("label"), c = input("checkbox"); c.value = o.v; c.checked = chosen.has(o.v); l.append(c, el("span", "", o.t)); wrap.append(l); }
      if (!(f.options || []).length) wrap.append(el("span", "muted", "لا يوجد أحد بهذا الدور بعد — أضفه من «الأشخاص والأدوار»"));
      box.append(wrap); get[f.key] = () => [...wrap.querySelectorAll("input:checked")].map((x) => x.value);
    } else if (f.type === "bool") {
      const l = el("label", "multi"), c = input("checkbox"); c.checked = !!v; lab.textContent = ""; const w = el("label"); w.append(c, el("span", "", f.label)); l.append(w); box.append(l); get[f.key] = () => c.checked;
    } else if (f.type === "items") {
      const t = el("table", "items"), hd = el("tr"); for (const c of ["البند", "الوحدة", "الكمية", "السعر", ""]) hd.append(el("th", "", c)); t.append(hd);
      const add = (it) => {
        const tr = el("tr"); tr.dataset.id = it.id || "";
        const n = input("text", it.name), u = input("text", it.unit || "م²"), q = input("text", it.qty), p = input("text", it.rate);
        q.inputMode = p.inputMode = "decimal"; if (it.locked) { p.disabled = true; p.title = "دخل في مستخلص"; }
        const del = el("button", "btn2 btn-sm", "حذف"); del.type = "button"; if (it.locked) del.disabled = true; del.onclick = () => tr.remove();
        for (const x of [n, u, q, p]) { const td = el("td"); td.append(x); tr.append(td); } const td = el("td"); td.append(del); tr.append(td);
        tr._v = () => ({ id: tr.dataset.id || undefined, name: n.value, unit: u.value, qty: q.value, rate: p.value }); t.append(tr);
      };
      for (const it of v || []) add(it); if (!(v || []).length) add({});
      const more = el("button", "btn2 btn-sm", "+ بند"); more.type = "button"; more.onclick = () => add({});
      const w = el("div", "tbl"); w.append(t); box.append(w, more);
      get[f.key] = () => [...t.querySelectorAll("tr")].filter((x) => x._v).map((x) => x._v());
    }
    if (f.hint) box.append(el("div", "hint", f.hint));
    body.append(box);
  }
  const res = el("div", "res"), bar = el("div", "bar"), save = el("button", "", "حفظ"), close = el("button", "btn2", "إغلاق");
  save.type = close.type = "button"; bar.append(save, close); body.append(res, bar);
  close.onclick = () => $("dlg").close();
  save.onclick = async () => {
    const out = {}; for (const k in get) out[k] = get[k]();
    save.disabled = true; res.className = "res"; res.textContent = "";
    try {
      const { status, j } = await api({ op: "save", ent: e.key, id: r ? r.id : "", data: out });
      if (status === 200) { res.className = "res ok"; res.textContent = j.msg || "تم الحفظ ✅"; await loadReg(); renderData(); setTimeout(() => $("dlg").close(), 900); }
      else if (status === 202) { res.className = "res warn"; res.textContent = (j.msg || "") + " — افتح واتساب واضغط «تأكيد»."; }
      else { res.className = "res bad"; res.textContent = j.error || "تعذّر الحفظ"; }
    } catch { res.className = "res bad"; res.textContent = "تعذّر الاتصال"; }
    save.disabled = false;
  };
  $("dlg").showModal();
}
for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", async () => {
  view = b.dataset.v; for (const x of document.querySelectorAll(".tab")) x.classList.toggle("on", x === b);
  if (view === "data") { await loadReg(); renderData(); } else load();
});
$("reload").addEventListener("click", async () => { if (view === "data") { await loadReg(); renderData(); } else load(); });
load().then(() => token && loadReg()).catch(() => {});
setInterval(() => { if (document.visibilityState === "visible" && view === "mon" && !$("dlg").open) load(); }, 120000);
</script>
</body>
</html>
