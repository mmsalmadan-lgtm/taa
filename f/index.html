<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>نموذج — مؤسسة طاء الرائدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1d2533; --red:#c62026; --ink:#1d2533; --muted:#6b7280; --line:#e3e6eb; --bg:#f4f5f7; --card:#fff; --ok:#1a7f37; --soft:#fbeaea; --warn:#fff6e0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; font-size:16px; }
  header { background:var(--navy); color:#fff; padding:14px 16px 12px; border-bottom:4px solid var(--red); }
  header .co { font-size:12px; opacity:.75; }
  header h1 { margin:3px 0 1px; font-size:20px; font-weight:700; }
  header .who { font-size:13px; opacity:.9; }
  main { padding:12px 12px 130px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .card .box { padding:12px 14px; }
  .lb { display:block; font-weight:600; margin:0 0 8px; font-size:15px; }
  .hint { color:var(--muted); font-size:12.5px; margin:-4px 0 8px; line-height:1.5; }
  .info { padding:11px 14px; font-size:14px; line-height:1.6; white-space:pre-line; }
  .info.warn { background:var(--warn); } .info.ok { background:#eaf6ee; }
  .grp > .hd { padding:11px 14px; font-weight:600; display:flex; justify-content:space-between; align-items:center; cursor:pointer; border-top:1px solid var(--line); background:#fafbfc; }
  .grp > .hd .cnt { background:var(--red); color:#fff; border-radius:20px; font-size:12px; padding:0 8px; }
  .grp > .bd { display:none; } .grp.open > .bd { display:block; }
  .row { display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid var(--line); }
  .row .nm { flex:1; font-size:15px; line-height:1.35; }
  .row .nm small { display:block; color:var(--muted); font-size:12px; }
  .row.on { background:#fff7f7; }
  .qty { display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; flex-shrink:0; }
  .qty button { width:34px; height:40px; border:0; background:#f2f3f5; font-size:19px; color:var(--navy); }
  .qty input { width:62px; height:40px; border:0; text-align:center; font:inherit; font-size:16px; font-weight:600; direction:ltr; }
  .fillb { border:1px solid var(--line); background:#fff; border-radius:8px; font:inherit; font-size:12px; padding:4px 8px; color:var(--navy); margin-top:4px; }
  .note { display:block; margin:0 14px 10px; width:calc(100% - 28px); padding:8px 10px; border:1px solid var(--line); border-radius:9px; font:inherit; font-size:14px; }
  select, input[type=date], input[type=text], input[type=number], textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:16px; background:#fff; color:var(--ink); }
  textarea { min-height:70px; resize:vertical; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font:inherit; font-size:14px; color:var(--ink); }
  .chip.sel { background:var(--navy); color:#fff; border-color:var(--navy); }
  .ck { list-style:none; margin:0 0 10px; padding:0; max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  .ck li { padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.5; }
  .ck li:last-child { border-bottom:0; } .ck li small { display:block; color:var(--muted); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .two .chip { text-align:center; padding:11px 8px; border-radius:10px; }
  .chip.okc.sel { background:var(--ok); border-color:var(--ok); } .chip.noc.sel { background:var(--red); border-color:var(--red); }
  .ph { display:flex; flex-wrap:wrap; gap:8px; }
  .ph .t { width:74px; height:74px; border-radius:10px; background:#e9ebef center/cover; position:relative; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); overflow:hidden; }
  .ph .t .x { position:absolute; top:2px; left:2px; background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:50%; width:22px; height:22px; font-size:13px; }
  .ph label.addp { width:74px; height:74px; border:1.5px dashed var(--muted); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--navy); cursor:pointer; }
  .ph input { display:none; }
  .other { display:grid; grid-template-columns:1fr 84px; gap:8px; padding:9px 14px; border-top:1px solid var(--line); }
  .add { margin:10px 14px 12px; border:1px dashed var(--muted); background:none; border-radius:10px; padding:9px; width:calc(100% - 28px); font:inherit; color:var(--navy); }
  .bar { position:fixed; inset:auto 0 0 0; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .bar .sum { font-size:12.5px; color:var(--muted); margin:0 auto 6px; max-width:640px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar button { display:block; width:100%; max-width:640px; margin:0 auto; border:0; border-radius:12px; padding:14px; font:inherit; font-size:17px; font-weight:700; background:var(--red); color:#fff; }
  .bar button:disabled { background:#d9a3a5; }
  .err { background:var(--soft); color:var(--red); border-radius:10px; padding:10px 12px; margin:0 0 10px; font-size:14px; display:none; }
  .done { text-align:center; padding:36px 18px; }
  .done .tick { width:72px; height:72px; border-radius:50%; background:var(--ok); color:#fff; font-size:40px; line-height:72px; margin:0 auto 14px; }
  .done p { color:var(--muted); white-space:pre-line; line-height:1.7; margin:0 0 18px; text-align:right; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .done a { display:inline-block; background:var(--navy); color:#fff; text-decoration:none; border-radius:12px; padding:12px 22px; font-weight:600; }
  .msg { text-align:center; padding:48px 18px; color:var(--muted); line-height:1.8; }
</style>
</head>
<body>
<header><div class="co">مؤسسة طاء الرائدة للمقاولات العامة</div><h1 id="title">نموذج</h1><div class="who" id="who"></div></header>
<main id="app"><div class="msg">جاري التحميل…</div></main>
<div class="bar" id="bar" hidden><div class="sum" id="sum"></div><button id="send" disabled>إرسال</button></div>
<script>
const API = "https://zkbwrgulnsycqqfbwkee.supabase.co/functions/v1/bird-webhook/form";
const BOT = "https://wa.me/966551313729";
const T = decodeURIComponent((location.hash || "").slice(1));
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const arn = (s) => String(s ?? "").replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace("٫", ".").replace(",", ".");
const fmt = (n) => String(Math.round(n * 1000) / 1000);
let S = null, V = {}, open = {}, busy = 0, thumbs = {};

function fail(t) { $("#app").innerHTML = `<div class="msg">${esc(t)}<br><br><a href="${BOT}" style="color:#1d2533">الرجوع للواتساب</a></div>`; $("#bar").hidden = true; }
async function call(body) { const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t: T, ...body }) }); return [r, await r.json().catch(() => ({}))]; }

async function load(first) {
  if (!T) return fail("الرابط غير مكتمل — افتح النموذج من البوت.");
  try {
    const [r, j] = await call({ op: "def", v: V });
    if (!r.ok) return fail(j.error || "تعذّر فتح النموذج");
    S = j; if (first || j.values) V = { ...(j.values || {}), ...V };
    if (j.values) for (const k of ["cid", "floor", "trade", "variant"]) if (j.values[k] !== undefined) V[k] = j.values[k]; // the server settles dependent choices
    $("#title").textContent = S.title; $("#who").textContent = [S.name, S.sub].filter(Boolean).join(" — "); document.title = S.title + " — طاء الرائدة";
    render();
  } catch (e) { fail("تعذّر الاتصال — تأكد من الإنترنت وأعد فتح الرابط."); }
}
const shown = (f) => !f.show || V[f.show.key] === f.show.eq;
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const today = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);

function fieldHtml(f, i) {
  if (!shown(f)) return "";
  const lb = f.label ? `<label class="lb">${esc(f.label)}</label>` : "";
  switch (f.type) {
    case "info": return `<div class="card"><div class="info ${f.tone || ""}">${esc(f.text)}</div></div>`;
    case "select": return `<div class="card"><div class="box">${lb}<select data-k="${f.key}" data-reload="${f.reload ? 1 : ""}">${f.options.map((o) => `<option value="${esc(o.v)}"${V[f.key] === o.v ? " selected" : ""}>${esc(o.t)}</option>`).join("")}</select></div></div>`;
    case "choice": return `<div class="card"><div class="box">${lb}<div class="chips">${f.options.map((o) => `<button type="button" class="chip${V[f.key] === o.v ? " sel" : ""}" data-set="${f.key}" data-val="${esc(o.v)}">${esc(o.t)}</button>`).join("")}</div></div></div>`;
    case "number": return `<div class="card"><div class="box">${lb}<input type="text" inputmode="decimal" data-num="1" data-k="${f.key}" value="${esc(V[f.key] ?? "")}" placeholder="${f.unit ? esc(f.unit) : ""}"></div></div>`;
    case "text": return `<div class="card"><div class="box">${lb}<input type="text" data-k="${f.key}" value="${esc(V[f.key] ?? "")}" placeholder="${esc(f.placeholder || "")}"></div></div>`;
    case "textarea": return `<div class="card"><div class="box">${lb}<textarea data-k="${f.key}" placeholder="${esc(f.placeholder || "")}">${esc(V[f.key] ?? "")}</textarea></div></div>`;
    case "date": { const t = f.min || today(); return `<div class="card"><div class="box">${lb}<div class="chips">${f.chips.map(([n, l]) => `<button type="button" class="chip${V[f.key] === addDays(t, n) ? " sel" : ""}" data-set="${f.key}" data-val="${addDays(t, n)}">${esc(l)}</button>`).join("")}</div><input type="date" data-k="${f.key}" value="${esc(V[f.key] || "")}" min="${t}"></div></div>`; }
    case "check": return `<div class="card"><div class="box">${lb}<ul class="ck">${f.items.map((x, k) => `<li>${k + 1}. ${x.hold ? "⛔ " : ""}${x.photo ? "📷 " : ""}${esc(x.t)}${x.c ? `<small>↳ ${esc(x.c)}</small>` : ""}</li>`).join("")}</ul>${f.items.some((x) => x.hold || x.photo) ? `<div class="hint">⛔ نقطة توقف · 📷 تحتاج صورة</div>` : ""}<div class="two"><button type="button" class="chip okc${V[f.key] === "ok" ? " sel" : ""}" data-set="${f.key}" data-val="ok">${esc(f.ok)}</button>${f.no ? `<button type="button" class="chip noc${V[f.key] === "no" ? " sel" : ""}" data-set="${f.key}" data-val="no">${esc(f.no)}</button>` : ""}${f.na ? `<button type="button" class="chip${V[f.key] === "na" ? " sel" : ""}" data-set="${f.key}" data-val="na">${esc(f.na)}</button>` : ""}</div></div></div>`;
    case "photos": {
      const list = V[f.key] || [], acc = f.accept === "video" ? "video/*" : f.accept === "image" ? "image/*" : f.accept === "doc" ? "image/*,application/pdf" : "image/*,video/*";
      const need = f.min ? ` (${f.min} على الأقل)` : "";
      return `<div class="card"><div class="box"><label class="lb">${esc(f.label)}${need}</label>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}<div class="ph">${list.map((ref, k) => `<div class="t" style="${thumbs[ref] ? `background-image:url(${thumbs[ref]})` : ""}">${thumbs[ref] ? "" : /\.(mp4|mov|3gp|webm)$/i.test(ref) ? "🎬 فيديو" : /\.pdf$/i.test(ref) ? "📄 PDF" : "✓"}<button type="button" class="x" data-del="${f.key}" data-i="${k}">×</button></div>`).join("")}${(f.max && list.length >= f.max) ? "" : `<label class="addp">+<input type="file" accept="${acc}" ${f.accept === "video" ? 'capture="environment"' : ""} multiple data-up="${f.key}"></label>`}</div></div></div>`;
    }
    case "items": {
      const val = V[f.key] || {}, groups = []; for (const r of f.rows) { const g = r.group || ""; let G = groups.find((x) => x.g === g); if (!G) groups.push(G = { g, rows: [] }); G.rows.push(r); }
      const rowH = (r) => { const q = (val[r.id] || {}).qty ?? ""; return `<div class="row${+q > 0 ? " on" : ""}"><div class="nm">${esc(r.name)}<small>${esc([r.unit, r.hint].filter(Boolean).join(" · "))}</small>${f.fill && r.max ? `<button type="button" class="fillb" data-fill="${f.key}" data-id="${esc(r.id)}" data-max="${r.max}">${esc(f.fill)}</button>` : ""}</div><div class="qty"><button type="button" data-step="${f.key}" data-id="${esc(r.id)}" data-d="-1">−</button><input inputmode="decimal" data-q="${f.key}" data-id="${esc(r.id)}" value="${esc(q)}" placeholder="0"><button type="button" data-step="${f.key}" data-id="${esc(r.id)}" data-d="1">+</button></div></div>${r.ask && +q > 0 ? `<input class="note" data-qn="${f.key}" data-id="${esc(r.id)}" value="${esc((val[r.id] || {}).note || "")}" placeholder="${esc(r.ask)}">` : ""}`; };
      const body = groups.length === 1 && !groups[0].g ? groups[0].rows.map(rowH).join("") : groups.map((G, gi) => { const id = f.key + ":" + gi, cnt = G.rows.filter((r) => +((val[r.id] || {}).qty) > 0).length; const op = open[id] ?? (gi === 0 || cnt > 0); return `<div class="grp${op ? " open" : ""}" data-grp="${id}"><div class="hd"><span>${esc(G.g)}</span><span>${cnt ? `<span class="cnt">${cnt}</span> ` : ""}▾</span></div><div class="bd">${G.rows.map(rowH).join("")}</div></div>`; }).join("");
      return `<div class="card"><div class="box" style="padding-bottom:8px"><label class="lb" style="margin:0">${esc(f.label)}</label></div>${body}</div>`;
    }
    case "others": { const list = V[f.key] || []; return `<div class="card"><div class="box" style="padding-bottom:4px"><label class="lb" style="margin:0">${esc(f.label)}</label></div>${list.map((o, k) => `<div class="other"><input type="text" data-oth="${f.key}" data-i="${k}" data-f="name" value="${esc(o.name)}" placeholder="الاسم"><input type="text" inputmode="decimal" data-oth="${f.key}" data-i="${k}" data-f="qty" value="${esc(o.qty)}" placeholder="الكمية">${f.unit ? `<input type="text" data-oth="${f.key}" data-i="${k}" data-f="unit" value="${esc(o.unit)}" placeholder="الوحدة (كيس، حبة، م³…)" style="grid-column:1/-1">` : ""}</div>`).join("")}<button type="button" class="add" data-addo="${f.key}">+ إضافة</button></div>`; }
  }
  return "";
}
function render() {
  const y = scrollY;
  $("#app").innerHTML = `<div class="err" id="err"></div>` + S.fields.map(fieldHtml).join("");
  $("#bar").hidden = !S.submit; if (S.submit) summary();
  scrollTo(0, y);
}
function summary() {
  const parts = []; for (const f of S.fields) if (f.type === "items" && shown(f)) for (const r of f.rows) { const q = ((V[f.key] || {})[r.id] || {}).qty; if (+q > 0) parts.push(`${r.name} ${q}`); }
  $("#sum").textContent = busy ? `جاري رفع ${busy} ملف…` : parts.length ? parts.join("، ") : "";
  $("#send").disabled = !!busy; $("#send").textContent = S.submit;
}
const setQ = (k, id, q) => { V[k] = V[k] || {}; V[k][id] = { ...(V[k][id] || {}), qty: q }; };

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, .hd"); if (!t) return;
  if (t.classList.contains("hd")) { const g = t.parentElement; g.classList.toggle("open"); open[g.dataset.grp] = g.classList.contains("open"); return; }
  if (t.dataset.step) { const v = Math.max(0, (+((V[t.dataset.step] || {})[t.dataset.id] || {}).qty || 0) + +t.dataset.d); setQ(t.dataset.step, t.dataset.id, v ? fmt(v) : ""); render(); return; }
  if (t.dataset.fill) { setQ(t.dataset.fill, t.dataset.id, t.dataset.max); render(); return; }
  if (t.dataset.set) { V[t.dataset.set] = t.dataset.val; render(); return; }
  if (t.dataset.del) { V[t.dataset.del].splice(+t.dataset.i, 1); render(); return; }
  if (t.dataset.addo) { (V[t.dataset.addo] = V[t.dataset.addo] || []).push({ name: "", unit: "", qty: "" }); render(); return; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.q) { setQ(t.dataset.q, t.dataset.id, arn(t.value)); t.closest(".row").classList.toggle("on", +arn(t.value) > 0); summary(); }
  else if (t.dataset.qn) { V[t.dataset.qn][t.dataset.id].note = t.value; }
  else if (t.dataset.oth) { V[t.dataset.oth][+t.dataset.i][t.dataset.f] = t.dataset.f === "qty" ? arn(t.value) : t.value; }
  else if (t.dataset.k && t.tagName !== "SELECT") V[t.dataset.k] = t.dataset.num ? arn(t.value) : t.value;
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.tagName === "SELECT") { V[t.dataset.k] = t.value; if (t.dataset.reload) { if (t.dataset.k === "cid") { for (const k of ["floor", "trade", "variant"]) delete V[k]; } await load(false); } return; }
  if (t.dataset.q) render(); // show the note field of an item that asks for one
  if (t.dataset.up) { const files = [...t.files]; t.value = ""; for (const f of files) upload(t.dataset.up, f); }
});

async function shrink(file) {
  if (!file.type.startsWith("image/") || file.size < 400e3) return file;
  try {
    const img = await createImageBitmap(file), s = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), "image/jpeg", 0.82));
  } catch { return file; }
}
async function upload(key, file) {
  busy++; summary();
  try {
    const blob = await shrink(file), type = blob.type || file.type || "application/octet-stream";
    const r = await fetch(`${API}/upload`, { method: "POST", headers: { "content-type": type, "x-form-token": T }, body: blob });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "تعذّر رفع الملف");
    (V[key] = V[key] || []).push(j.ref);
    if (type.startsWith("image/")) thumbs[j.ref] = URL.createObjectURL(blob);
  } catch (e) { const err = $("#err"); err.textContent = e.message || "تعذّر رفع الملف"; err.style.display = "block"; }
  busy--; render();
}

$("#send").addEventListener("click", async () => {
  const err = $("#err"), btn = $("#send"); err.style.display = "none"; btn.disabled = true; btn.textContent = "جاري الإرسال…";
  try {
    const [r, j] = await call({ op: "submit", v: V });
    if (!r.ok) { err.textContent = j.error || "تعذّر الإرسال"; err.style.display = "block"; scrollTo(0, 0); summary(); return; }
    $("#bar").hidden = true;
    // pending: the bot parked the form and asks for a WhatsApp confirmation from the person's own number
    $("#app").innerHTML = `<div class="done"><div class="tick">${j.pending ? "🔐" : "✓"}</div><h2>${j.pending ? "بانتظار تأكيدك في واتساب" : "تم الإرسال"}</h2>${j.msg ? `<p>${esc(j.msg)}</p>` : ""}<a href="${BOT}">${j.pending ? "افتح واتساب للتأكيد" : "الرجوع للواتساب"}</a></div>`;
  } catch (e) { err.textContent = "تعذّر الاتصال — حاول مرة أخرى"; err.style.display = "block"; summary(); }
});
load(true);
</script>
</body>
</html>
