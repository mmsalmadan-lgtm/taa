  /* the company's quotation, as the customer sees it: one decision, one code, one receipt. Light only, like the dashboard. */
  :root { --navy:#1D2533; --brand:#C62026; --ink:#1D2533; --muted:#5d6672; --line:#dde1e6; --bg:#F1F3F4; --card:#fff; --ok:#17733a; --okbg:#e9f5ee; --bad:#a3191e; --badbg:#fbecec; --warnbg:#fff4dc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; font-size:16px; line-height:1.6; }
  header { background:var(--navy); color:#fff; padding:16px 16px 14px; border-bottom:4px solid var(--brand); }
  header .co { font-size:12.5px; opacity:.8; }
  header h1 { font-family:"Readex Pro",sans-serif; margin:4px 0 0; font-size:21px; font-weight:600; }
  main { max-width:620px; margin:0 auto; padding:14px 16px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .price { font-family:"SAR","Readex Pro",sans-serif; font-size:30px; font-weight:600; letter-spacing:-.2px; }
  .sar { font-family:"SAR",sans-serif; font-size:24px; }
  .muted { color:var(--muted); font-size:14px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:10px 0 0; font-size:15px; }
  dt { color:var(--muted); } dd { margin:0; }
  ul { margin:6px 0 0; padding-inline-start:20px; }
  h2 { font-family:"Readex Pro",sans-serif; font-size:17px; font-weight:600; margin:0 0 8px; }
  .consent { background:#f6f7f9; border-inline-start:3px solid var(--navy); padding:10px 12px; border-radius:6px; font-size:15px; }
  label { display:block; font-weight:600; margin:12px 0 6px; font-size:15px; }
  input[type=text], input[inputmode], textarea { width:100%; font:inherit; padding:11px 12px; border:1px solid #b9c0c8; border-radius:9px; background:#fff; color:var(--ink); }
  textarea { min-height:84px; resize:vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid #8fb4e3; outline-offset:2px; }
  .chk { display:flex; gap:10px; align-items:flex-start; font-weight:500; }
  .chk input { width:22px; height:22px; margin-top:3px; flex:none; }
  .seg { display:grid; grid-template-columns:1fr; gap:8px; margin-top:6px; }
  .seg button { min-height:48px; border-radius:10px; border:1px solid #b9c0c8; background:#fff; font:inherit; font-weight:600; color:var(--ink); text-align:start; padding:10px 14px; }
  .seg button[aria-pressed=true] { border:2px solid var(--navy); background:#eef1f6; }
  .act { width:100%; min-height:50px; border:0; border-radius:10px; background:var(--navy); color:#fff; font:inherit; font-weight:600; font-size:16px; margin-top:14px; }
  .act[disabled] { opacity:.5; }
  .sec { width:100%; min-height:46px; border:1px solid var(--navy); border-radius:10px; background:#fff; color:var(--navy); font:inherit; font-weight:600; margin-top:10px; }
  .dl { display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:0 16px; border-radius:10px; background:#fff; border:1px solid var(--navy); color:var(--navy); font-weight:600; text-decoration:none; margin-top:12px; }
  .msg { margin-top:10px; padding:10px 12px; border-radius:9px; font-size:15px; }
  .msg.bad { background:var(--badbg); color:var(--bad); } .msg.ok { background:var(--okbg); color:var(--ok); } .msg.info { background:var(--warnbg); }
  .receipt { text-align:center; padding:22px 16px; }
  .receipt .no { font-family:"Readex Pro",sans-serif; font-size:20px; font-weight:600; margin:6px 0; direction:ltr; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: no-preference) { .act, .sec, .seg button { transition:background .15s, border-color .15s; } }

<body>
<header><div class="co">مؤسسة طاء الرائدة للمقاولات العامة</div><h1 id="ttl">عرض السعر</h1></header>
<main id="m">
  <div class="card" id="loading">جارٍ فتح العرض…</div>
</main>
<script>
const API = "https://zkbwrgulnsycqqfbwkee.supabase.co/functions/v1/bird-webhook/accept";
const TOK = decodeURIComponent((location.hash || "").slice(1));
history.replaceState(null, "", location.pathname); // the link stays out of the address bar once read
const $ = (id) => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };
const fmt = (n) => n === null || n === undefined ? "—" : Math.round(n).toLocaleString("en-US");
async function call(body) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-form-token": TOK }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch {}
  return { status: r.status, j };
}
let V = null, choice = null;
function draw() {
  const m = $("m"); m.replaceChildren();
  $("ttl").textContent = "عرض السعر " + V.no + " — الإصدار " + V.v;
  const top = el("div", "card");
  top.append(el("div", "muted", V.customer ? "إلى: " + V.customer : ""));
  const pr = el("div", "price"); pr.append(document.createTextNode(fmt(V.priceVat) + " "), el("span", "sar", "\u20C1")); top.append(pr);
  top.append(el("div", "muted", "شامل ضريبة القيمة المضافة" + (V.vatRate ? " " + Math.round(V.vatRate * 100) + "%" : "") + (V.price ? " · قبل الضريبة " + fmt(V.price) : "")));
  const dl = el("dl");
  if (V.programme && V.programme.days) dl.append(el("dt", "", "مدة التنفيذ"), el("dd", "", V.programme.days + " يوماً"));
  if (V.validUntil) dl.append(el("dt", "", "الرابط صالح حتى"), el("dd", "", V.validUntil));
  if (dl.children.length) top.append(dl);
  if (V.file) { const a = el("a", "dl", "تحميل العرض الكامل (PDF)"); a.href = V.file; a.target = "_blank"; a.rel = "noopener"; top.append(a); }
  m.append(top);
  if ((V.payments || []).length) { const c = el("div", "card"); c.append(el("h2", "", "الدفعات")); const u = el("ul"); V.payments.forEach((p) => u.append(el("li", "", p.name + " — " + Math.round((p.pct || 0) * 100) + "%" + (p.when ? " — " + p.when : "")))); c.append(u); m.append(c); }
  if ((V.exclusions || []).length) { const c = el("div", "card"); c.append(el("h2", "", "غير مشمول")); const u = el("ul"); V.exclusions.forEach((x) => u.append(el("li", "", x))); c.append(u); m.append(c); }
  if (V.decision) { m.append(receipt(V.decision.type, V.decision.receipt)); return; }
  // the decision
  const d = el("div", "card"); d.append(el("h2", "", "قراركم"), el("div", "muted", "فتح هذه الصفحة أو تحميل العرض ليس موافقة. القرار يُسجَّل برمز تحقق يصل لجوالكم المسجل لدينا."));
  const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "القرار");
  for (const [k, t] of [["accept", "الموافقة على عرض السعر"], ["changes", "طلب تعديل"], ["decline", "رفض"]]) { const b = el("button", "", t); b.type = "button"; b.setAttribute("aria-pressed", String(choice === k)); b.onclick = () => { choice = k; draw(); }; seg.append(b); }
  d.append(seg);
  if (choice) {
    if (choice === "accept" && V.consent) { d.append(el("label", "", "نص الموافقة")); d.append(el("div", "consent", V.consent.text)); const l = el("label", "chk"), c = el("input"); c.type = "checkbox"; c.id = "cons"; l.append(c, document.createTextNode("أقرّ بالنص أعلاه وأوافق على هذا الإصدار من عرض السعر")); d.append(l); }
    if (choice !== "accept") { const l = el("label", "", choice === "changes" ? "التعديل المطلوب" : "سبب الرفض"), t = el("textarea"); t.id = "note"; l.htmlFor = "note"; d.append(l, t); }
    const ln = el("label", "", "الاسم الكامل"), n = el("input"); n.type = "text"; n.id = "nm"; n.autocomplete = "name"; ln.htmlFor = "nm"; d.append(ln, n);
    const lc = el("label", "", "الصفة (لمن يوقّع عن شركة أو عن المالك)"), cp = el("input"); cp.type = "text"; cp.id = "cap"; cp.placeholder = "مثال: المالك، أو وكيل بموجب وكالة رقم …"; lc.htmlFor = "cap"; d.append(lc, cp);
    const ob = el("button", "sec", "إرسال رمز التحقق إلى " + V.phone); ob.type = "button"; ob.id = "otpb"; d.append(ob);
    const lo = el("label", "", "رمز التحقق"), oc = el("input"); oc.setAttribute("inputmode", "numeric"); oc.autocomplete = "one-time-code"; oc.maxLength = 6; oc.id = "code"; lo.htmlFor = "code"; d.append(lo, oc);
    const go = el("button", "act", choice === "accept" ? "تأكيد الموافقة" : choice === "changes" ? "إرسال طلب التعديل" : "تأكيد الرفض"); go.type = "button"; d.append(go);
    const msg = el("div", ""); msg.setAttribute("role", "status"); msg.id = "msg"; d.append(msg);
    ob.onclick = async () => { ob.disabled = true; const r = await call({ op: "otp" }).catch(() => ({ status: 0, j: {} })); ob.disabled = false;
      if (r.status === 200) say(r.j.window === "closed" ? "أرسلنا لكم رسالة على واتساب من رقم المؤسسة — ردّوا عليها ويصلكم الرمز مباشرة." : "أُرسل الرمز إلى " + r.j.phone + " — صالح 10 دقائق.", "info"); else say(r.j.error || "تعذّر الإرسال — حاولوا لاحقاً", "bad"); };
    go.onclick = async () => {
      const body = { op: "decide", type: choice, name: n.value.trim(), capacity: cp.value.trim(), code: oc.value.trim(), consent: !!($("cons") && $("cons").checked), note: $("note") ? $("note").value.trim() : "" };
      go.disabled = true; const r = await call(body).catch(() => ({ status: 0, j: {} })); go.disabled = false;
      if (r.status === 200) { V.decision = { type: choice, receipt: r.j.receipt }; draw(); window.scrollTo(0, 0); }
      else say(r.j.error || "تعذّر الإرسال — حاولوا مرة أخرى", "bad");
    };
  }
  m.append(d);
}
function say(t, k) { const x = $("msg"); x.className = "msg " + k; x.textContent = t; }
function receipt(type, no) {
  const c = el("div", "card receipt");
  c.append(el("h2", "", type === "accept" ? "سُجّلت موافقتكم على عرض السعر" : type === "changes" ? "وصل طلب التعديل" : "سُجّل رفضكم للعرض"));
  c.append(el("div", "muted", "رقم الإيصال"), el("div", "no", no || "—"));
  c.append(el("div", "muted", type === "accept" ? "الخطوة التالية: نرسل لكم العقد لمراجعته وتوقيعه إلكترونياً. الموافقة على العرض ليست توقيعاً على العقد." : type === "changes" ? "نُعدّ إصداراً جديداً من العرض ونرسله لكم برابط جديد." : "شكراً لوقتكم."));
  return c;
}
(async () => {
  if (!TOK) { $("m").replaceChildren(el("div", "card", "الرابط ناقص — افتحوه من الرسالة كما وصلت.")); return; }
  try { const r = await call({ op: "view" }); if (r.status !== 200) { $("m").replaceChildren(el("div", "card", r.j.error || "تعذّر فتح العرض.")); return; } V = r.j; draw(); }
  catch { $("m").replaceChildren(el("div", "card", "تعذّر الاتصال — حاولوا مرة أخرى.")); }
})();
</script>
</body>
</html>
